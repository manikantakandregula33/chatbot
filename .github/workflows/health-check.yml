
name: Render Health Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check chatbot health
        run: |
          echo "Checking Render chatbot..."
          curl --fail --silent --show-error \
            --max-time 120 \
            https://chatbot-0jak.onrender.com/api/health
          echo "Health check completed."
